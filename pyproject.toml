[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-advanced-paste"
version = "0.1.0"
description = "Advanced Paste for Omarchy: transform the clipboard on its way into the window — plain text, Markdown, JSON, CSV tables, case, encodings, or anything you can describe to your coding agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Andre Bruno" }]
keywords = ["omarchy", "powertoys", "clipboard", "wayland", "hyprland", "advanced-paste"]
classifiers = [
  "Environment :: X11 Applications",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]
dependencies = []

[project.scripts]
omarchy-advanced-paste = "oadvpaste.cli:main"

[project.urls]
Homepage = "https://github.com/andrebbruno/omarchy-advanced-paste"

[tool.setuptools.packages.find]
include = ["oadvpaste*"]
